services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: BTS
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bts_db
      DB_USERNAME: bts_user
      DB_PASSWORD: bts_password
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www
      - /var/www/vendor
    networks:
      - bts_network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bts_db
      MYSQL_USER: bts_user
      MYSQL_PASSWORD: bts_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bts_user", "-pbts_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bts_network

volumes:
  mysql_data:

networks:
  bts_network:
    driver: bridge
